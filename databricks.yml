# ================================================================
# Databricks Asset Bundle — synthea-project
# ================================================================
# Este arquivo define o pipeline ETL como código (IaC).
# Todas as alterações devem ser feitas via Git (Pull Request).
# Deploy automático via GitHub Actions ao fazer merge na branch main.
# ================================================================

bundle:
  name: synthea-project

# ────────────────────────────────────────────
# Variáveis parametrizáveis por ambiente
# ────────────────────────────────────────────
variables:
  catalog:
    default: synthea
  schema:
    default: master_table

# ────────────────────────────────────────────
# Recursos: Jobs e Tasks
# ────────────────────────────────────────────
resources:
  jobs:
    synthea_etl_pipeline:
      name: "synthea-etl-pipeline"

      # Schedule: execução diária às 08:00 (horário de São Paulo)
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: "America/Sao_Paulo"

      # Tasks do pipeline (executadas em sequência)
      # Usa Serverless Compute via environment_key (Free Edition)
      tasks:
        # Task 1: Cria a master_table a partir das tabelas brutas
        - task_key: criar_master_table
          environment_key: default
          spark_python_task:
            python_file: ./src/main.py

        # Task 2: Limpa e consolida a master_table
        - task_key: limpar_master_table
          depends_on:
            - task_key: criar_master_table
          environment_key: default
          spark_python_task:
            python_file: ./src/master_table_clean.py

      # Definição do ambiente serverless
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies: []

      # Notificações por e-mail
      email_notifications:
        on_success:
          - thiago2608santana@gmail.com
        on_failure:
          - thiago2608santana@gmail.com

      # ────────────────────────────────────────
      # Permissões (RBAC)
      # Free Edition com usuário único: não é necessário restringir.
      # Descomente e ajuste quando houver mais usuários no workspace.
      # ────────────────────────────────────────
      # permissions:
      #   - group_name: "users"
      #     level: CAN_VIEW
      #   - group_name: "admins"
      #     level: CAN_MANAGE

# ────────────────────────────────────────────
# Target (Workspace único — Free Edition)
# ────────────────────────────────────────────
targets:
  default:
    default: true
    workspace:
      host: https://dbc-cddd3ed8-7fec.cloud.databricks.com

    # Quando migrar para um plano pago com workspaces separados,
    # crie targets adicionais (dev, staging, prod) apontando
    # para hosts diferentes. Exemplo:
    #
    # dev:
    #   mode: development
    #   default: true
    #   workspace:
    #     host: https://dbc-dev.cloud.databricks.com
    #
    # prod:
    #   mode: production
    #   workspace:
    #     host: https://dbc-prod.cloud.databricks.com
    #   run_as:
    #     service_principal_name: "deploy-sp@your-org.com"
